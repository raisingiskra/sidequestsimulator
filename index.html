
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Super Cool Side Quests</title>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #FFA7A6;
        font-size: 45px;
        font-family: "Mountains of Christmas";
        color: #8B0000;
        text-align: center;
      }

      .titlediv {
        border: 12px solid orange;
        margin: auto;
        background-color: #FFF5C5;
        padding: 5px;
        text-align: center;
        border-radius: 20px;
      }

      a {
        text-decoration: none;
        color: #8B0000;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 25px;
      }

      .grid-item {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background-color: #F7E5EC;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        min-height: 100px;
        border: 12px solid orange;
        overflow-wrap: anywhere;
        transition: background-color 0.2s ease;
      }

      .grid-item:hover {
        background-color: #FFA7A6;
        cursor: pointer;
      }

      .grid-item:focus-visible {
        outline: 4px dashed #8B0000;
        outline-offset: 4px;
      }

      @media (max-width: 600px) {
        body {
          font-size: 30px;
        }

        .grid-item {
          padding: 20px 10px;
          border-width: 6px;
        }
      }
    </style>
  </head>

  <body>

    <div class="titlediv">
      <img src="glitter-text 2.gif"
           style="width:100%; height:initial;"
           alt="Side Quest Generator!! Choose a category and quest away :D">
    </div>

    <div class="grid-container">

      <a class="grid-item" href="ss.html">
        Short 'n Sweet Quests
      </a>

      <a class="grid-item" href="cc.html">
        Challenge Quests
      </a>

      <a class="grid-item" href="pp.html">
        Quests with just a pen and paper
      </a>

      <a class="grid-item" href="qq.html">
        Quests with extra materials
      </a>

    </div>

  </body>
</html>

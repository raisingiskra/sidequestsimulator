<!DOCTYPE html>
<html>
  <head>
    <title>Super Cool Side Quests</title>
    <meta charset="UTF-8">
    <html lang="en">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color:#FFA7A6;
        font-size:25px;
        font-family:"Mountains of Christmas";
        color:#FADA5E;
      }
      
      .titlediv {
        border: 12px solid orange;
        margin:auto;
        background-color: #FFF5C5;
        padding:5px;
        text-align:center;
        border-radius:20px;
      }
    </style>
  </head>
  <body>
    <div class="titlediv">
    <img src="glitter-text 2.gif" style="width:100%; height:initial;" alt="Side Quest Generator!! Click the button, i know you want to :3">
    </div>
       <button id="generateButton"><img src=“milkbutton.png” alt=“Click the button!”></button>
    <script>
        const texts = [
            "Hello, world!",
            "This is some random text.",
            "Have a great day!",
            "JavaScript is awesome!",
            "You got a random message!"
        ];

        const button = document.getElementById("generateButton");
        const output = document.getElementById("randomText");

        button.addEventListener("click", function() {
            const randomIndex = Math.floor(Math.random() * texts.length);
            output.textContent = texts[randomIndex];
        });
    </script>
  </body>
</html>

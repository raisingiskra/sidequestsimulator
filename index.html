<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Super Cool Side Quests</title>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #FFA7A6;
        font-size: 45px;
        font-family: "Mountains of Christmas";
        color: #FADA5E;
        text-align: center;
      }

      .titlediv {
        border: 12px solid orange;
        margin: auto;
        background-color: #FFF5C5;
        padding: 5px;
        text-align: center;
        border-radius: 20px;
      }

      #generateButton {
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
      }

      #generateButton img {
        width: 200px;
      }
    </style>
  </head>

  <body>
    
<section>Click this --></section>
    <div class="titlediv">
      <img src="glitter-text 2.gif"
           style="width:100%; height:initial;"
           alt="Side Quest Generator!! Click the button, i know you want to :3">
    </div>

    <button id="generateButton">
      <img src="catbutton.png" alt="Click the button!">
    </button>

    <p id="randomText">Your side quest will appear here!</p>

    <script>
      const texts = [
        "Eat a bag of Skittles but only the red ones!",
        "Compliment a stranger!",
        "Take a pair of socks and make them puppets! (Give them names!!)",
        "Try a new food :3",
        "DO IT AGAIN",
        "Try a new game:3",
        "Draw a new boy oc",
        "Draw an island or map, (give it a name:)",
        "Make a little plot with a plot twist",
        "Make a story with your childhood",
        "Draw a new girl oc",
        "Thrift flip somethinggg (like paint a cheap candle)"
      ];

      const button = document.getElementById("generateButton");
      const output = document.getElementById("randomText");

      button.addEventListener("click", function() {
        const randomIndex = Math.floor(Math.random() * texts.length);
        output.textContent = texts[randomIndex];
      });
    </script>

  </body>
</html>
